<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>광고주 통합 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e6e8ec; --accent:#2f5bea; --good:#2f9e44; --warn:#e8590c; --chip:#eef1f6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1115; --card:#171a21; --ink:#e8eaed; --muted:#9aa3ad; --line:#262b34; --accent:#6d8cff; --chip:#222733; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 Pretendard, -apple-system, sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:24px 16px 60px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; justify-content:space-between; margin-bottom:18px; }
  h1 { font-size:24px; margin:0; }
  .sub { color:var(--muted); font-size:13px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 13px; border-radius:999px; font:600 13px Pretendard, sans-serif; cursor:pointer; }
  .chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .total { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .box .l { color:var(--muted); font-size:12px; }
  .box .v { font-size:24px; font-weight:800; margin-top:2px; }
  .box .v small { font-size:13px; font-weight:600; margin-left:2px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .name { font-weight:800; font-size:17px; display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .tag { font-size:11px; color:var(--muted); background:var(--chip); padding:3px 8px; border-radius:999px; }
  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .kpi .l { color:var(--muted); font-size:12px; }
  .kpi .v { font-weight:800; font-size:20px; }
  .kpi .v small { font-size:12px; font-weight:600; }
  .delta { font-size:12px; font-weight:600; }
  .up { color:var(--good); } .down { color:var(--warn); }
  .media { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
  .media b { color:var(--ink); }
  .staff { font-size:12px; color:var(--muted); border-top:1px dashed var(--line); padding-top:8px; }
  .staff b { color:var(--ink); }
  svg { width:100%; height:56px; display:block; }
  .links { display:flex; gap:8px; flex-wrap:wrap; }
  .links a { font-size:12px; font-weight:700; color:var(--accent); text-decoration:none; border:1px solid var(--line); padding:6px 10px; border-radius:10px; }
  .err { color:var(--warn); font-size:13px; }
  .empty { color:var(--muted); font-size:13px; }
  .setup { max-width:560px; margin:60px auto; text-align:center; color:var(--muted); }
  @media (max-width:720px) { .total { grid-template-columns:repeat(2,1fr); } .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>광고주 통합 대시보드</h1><div class="sub" id="stamp">불러오는 중…</div></div>
    <div class="chips" id="periods"></div>
  </header>
  <section class="total" id="total"></section>
  <section class="grid" id="grid"></section>
</div>
<script>
// The client list (with access tokens) is never stored in this public file. It arrives once in the link's
// #hash (never sent to any server), is kept in this browser's localStorage, and the hash is then removed.
var KEY = 'hubClients.v1';
function readConfig() {
  var h = location.hash.slice(1);
  if (h.indexOf('c=') === 0) {
    try {
      var json = decodeURIComponent(escape(atob(h.slice(2).replace(/-/g, '+').replace(/_/g, '/'))));
      var list = JSON.parse(json);
      try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
      history.replaceState(null, '', location.pathname);
      return list;
    } catch (e) { return null; }
  }
  try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; }
}
var CLIENTS = readConfig();
var PERIODS = [['today', '오늘'], ['yesterday', '어제'], ['7d', '최근 7일'], ['month', '이번 달'], ['all', '전체']];
var period = 'today';
try { period = localStorage.getItem('hubPeriod') || 'today'; } catch (e) {}
var DATA = {};
var $ = function (id) { return document.getElementById(id); };
var won = function (n) { return Math.round(n).toLocaleString('ko-KR'); };
var kst = function (ms) { return new Date(ms + 9 * 3600e3).toISOString().slice(0, 10); };
var TODAY = kst(Date.now());
var shift = function (d, n) { return kst(Date.parse(d + 'T12:00:00Z') - 9 * 3600e3 + n * 864e5); };
function bounds(p, today) {
  if (p === 'today') return [today, today];
  if (p === 'yesterday') return [shift(today, -1), shift(today, -1)];
  if (p === '7d') return [shift(today, -6), today];
  if (p === 'month') return [today.slice(0, 8) + '01', today];
  return ['0000-00-00', today];
}
function prevBounds(p, today) {
  if (p === 'today') return [shift(today, -1), shift(today, -1)];
  if (p === 'yesterday') return [shift(today, -2), shift(today, -2)];
  if (p === '7d') return [shift(today, -13), shift(today, -7)];
  return null;
}
var leadsOf = function (d) { return (d.g || 0) + (d.m || 0) + (d.k || 0) + (d.o || 0); };
var spendOf = function (d) { return (d.sg || 0) + (d.sm || 0) + (d.sk || 0); };
function sum(days, b) {
  var r = { n: 0, s: 0, g: 0, m: 0, k: 0, as: {} };
  days.forEach(function (d) {
    if (d.d < b[0] || d.d > b[1]) return;
    r.n += leadsOf(d); r.s += spendOf(d); r.g += (d.g || 0) + (d.o || 0); r.m += d.m || 0; r.k += d.k || 0;
    if (d.as) Object.keys(d.as).forEach(function (k) { r.as[k] = (r.as[k] || 0) + d.as[k]; });
  });
  return r;
}
function spark(days, color) {
  var last = days.slice(-14), max = Math.max.apply(null, last.map(leadsOf).concat([1]));
  var w = 300, h = 56, step = w / Math.max(last.length, 1);
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img" aria-label="최근 14일 신청 수">' + last.map(function (d, i) {
    var bh = Math.max(2, leadsOf(d) / max * (h - 6));
    return '<rect x="' + (i * step + 2) + '" y="' + (h - bh) + '" width="' + Math.max(step - 4, 2) + '" height="' + bh + '" rx="2" fill="' + color + '" opacity="' + (d.d === TODAY ? 1 : .55) + '"><title>' + d.d.slice(5) + ' ' + leadsOf(d) + '건</title></rect>';
  }).join('') + '</svg>';
}
function deltaTxt(cur, prev) {
  if (prev == null) return '';
  // Today is still running, so show yesterday's full count instead of a misleading drop.
  if (period === 'today') return '<span class="delta" style="color:var(--muted)">어제 ' + prev + '건</span>';
  var diff = cur - prev;
  if (!diff) return '<span class="delta">전 기간과 같음</span>';
  return '<span class="delta ' + (diff > 0 ? 'up' : 'down') + '">' + (diff > 0 ? '▲' : '▼') + Math.abs(diff) + '</span>';
}
function render() {
  $('periods').innerHTML = PERIODS.map(function (p) { return '<button class="chip' + (p[0] === period ? ' on' : '') + '" data-p="' + p[0] + '">' + p[1] + '</button>'; }).join('');
  var tot = { n: 0, s: 0, live: 0 };
  $('grid').innerHTML = CLIENTS.map(function (c, i) {
    var links = '<div class="links">' + (c.links || []).map(function (l) { return '<a href="' + l[1] + '" target="_blank" rel="noopener">' + l[0] + '</a>'; }).join('') + '</div>';
    var head = '<div class="top"><div class="name"><span class="dot" style="background:' + (c.color || '#888') + '"></span>' + c.name + '</div><span class="tag">' + (c.media || '') + '</span></div>';
    if (!c.api) return '<div class="card">' + head + '<div class="empty">' + (c.note || '실시간 숫자 연결 전') + '</div>' + links + '</div>';
    var d = DATA[i];
    if (!d) return '<div class="card">' + head + '<div class="empty">불러오는 중…</div>' + links + '</div>';
    if (d.error) return '<div class="card">' + head + '<div class="err">불러오지 못함: ' + d.error + '</div>' + links + '</div>';
    var today = d.today || TODAY, b = bounds(period, today), r = sum(d.days, b), pb = prevBounds(period, today);
    var pr = pb ? sum(d.days, pb) : null;
    tot.n += r.n; tot.s += r.s; tot.live++;
    var media = [['구글', r.g], ['메타', r.m], ['당근', r.k]].filter(function (x) { return x[1] || (c.media || '').indexOf(x[0]) >= 0; })
      .map(function (x) { return x[0] + ' <b>' + x[1] + '</b>'; }).join(' · ');
    var staff = Object.keys(r.as).length ? '<div class="staff">실장님 배정 · ' + Object.keys(r.as).map(function (k) { return k + ' <b>' + r.as[k] + '</b>'; }).join(' · ') + '</div>' : '';
    return '<div class="card">' + head +
      '<div class="kpis"><div class="kpi"><div class="l">신청</div><div class="v">' + r.n + '<small>건</small></div>' + deltaTxt(r.n, pr && pr.n) + '</div>' +
      '<div class="kpi"><div class="l">광고비</div><div class="v">' + (r.s ? won(r.s) : '–') + '<small>' + (r.s ? '원' : '') + '</small></div></div>' +
      '<div class="kpi"><div class="l">단가</div><div class="v">' + (r.s && r.n ? won(r.s / r.n) : '–') + '<small>' + (r.s && r.n ? '원' : '') + '</small></div></div></div>' +
      '<div class="media">' + media + '</div>' + spark(d.days, c.color || '#888') + staff + links + '</div>';
  }).join('');
  var label = PERIODS.filter(function (p) { return p[0] === period; })[0][1];
  $('total').innerHTML =
    '<div class="box"><div class="l">' + label + ' 전체 신청</div><div class="v">' + tot.n + '<small>건</small></div></div>' +
    '<div class="box"><div class="l">' + label + ' 전체 광고비</div><div class="v">' + (tot.s ? won(tot.s) : '–') + '<small>' + (tot.s ? '원' : '') + '</small></div></div>' +
    '<div class="box"><div class="l">평균 단가</div><div class="v">' + (tot.s && tot.n ? won(tot.s / tot.n) : '–') + '<small>' + (tot.s && tot.n ? '원' : '') + '</small></div></div>' +
    '<div class="box"><div class="l">광고주</div><div class="v">' + CLIENTS.length + '<small>곳 (실시간 ' + tot.live + ')</small></div></div>';
  $('stamp').textContent = '광고비는 각 리포트에 입력된 금액 기준 · ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ' 갱신 · 1분마다 자동 갱신';
}
function load() {
  CLIENTS.forEach(function (c, i) {
    if (!c.api) return;
    fetch(c.api + '?api=report&v=' + encodeURIComponent(c.token), { credentials: 'omit', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (r) { DATA[i] = r.ok ? r.data : { error: r.error || '권한 없음' }; render(); })
      .catch(function () { if (!DATA[i]) DATA[i] = { error: '연결 실패' }; render(); });
  });
}
if (!CLIENTS || !CLIENTS.length) {
  document.querySelector('.wrap').innerHTML = '<div class="setup"><h2>광고주 목록이 없습니다</h2><p>받으신 전체 링크(#c=… 포함)로 한 번 열어 주세요. 한 번 열면 이 브라우저에 저장됩니다.</p></div>';
} else {
  $('periods').addEventListener('click', function (e) { var p = e.target.dataset.p; if (!p) return; period = p; try { localStorage.setItem('hubPeriod', p); } catch (x) {} render(); });
  render(); load(); setInterval(function () { if (!document.hidden) load(); }, 60000);
}
</script>
</body>
</html>
